<div class="page active" id="page-cards">
  <div class="filter-row" style="margin-bottom:20px;flex-wrap:wrap">
    <select id="card-filter" onchange="renderCards()" style="background:var(--card2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:4px;font-size:12px">
      <option value="all">전체</option>
      <option value="pitcher">투수만</option>
      <option value="batter">타자만</option>
      <option value="favorites">⭐ 즐겨찾기만</option>
    </select>
    <select id="card-team" onchange="renderCards()" style="background:var(--card2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:4px;font-size:12px;margin-left:8px">
      <option value="all">🏟️ 전체 팀</option>
    </select>
    <select id="card-group" onchange="renderCards()" style="background:var(--card2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:4px;font-size:12px;margin-left:8px">
      <option value="all">👥 전체 그룹</option>
    </select>
    <select id="card-sort" onchange="renderCards()" style="background:var(--card2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:4px;font-size:12px;margin-left:8px">
      <option value="ovr">OVR 순</option>
      <option value="name">이름 순</option>
      <optgroup label="── 투수 능력치 ──">
        <option value="p:구속">구속</option>
        <option value="p:구위">구위</option>
        <option value="p:제구">제구</option>
        <option value="p:구변">구변</option>
        <option value="p:탈삼진">탈삼진</option>
        <option value="p:구종">구종</option>
        <option value="p:안정성">안정성</option>
      </optgroup>
      <optgroup label="── 타자 능력치 ──">
        <option value="b:파워">파워</option>
        <option value="b:갭파워">갭파워</option>
        <option value="b:컨택">컨택</option>
        <option value="b:선구">선구</option>
        <option value="b:스윗스팟">스윗스팟</option>
      </optgroup>
    </select>
    <button id="card-edit-toggle" onclick="toggleCardEditMode()" title="편집 모드 (✏️ 버튼 표시/숨김)" style="background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:4px;font-size:12px;cursor:pointer">✏️ 편집 OFF</button>
    <div class="filter-tools-menu" style="margin-left:auto;position:relative">
      <button onclick="this.parentNode.classList.toggle('open')" title="도구" style="background:var(--card2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer">⚙️ 도구 ▾</button>
      <div class="filter-tools-dropdown">
        <button onclick="this.closest('.filter-tools-menu').classList.remove('open');openTeamGroupEditor()">👥 팀/그룹 편집</button>
        <button onclick="this.closest('.filter-tools-menu').classList.remove('open');diagnoseProfile()">🩺 프로필 진단</button>
        <button onclick="this.closest('.filter-tools-menu').classList.remove('open');_showOvrLegend()">🎨 OVR 색상 가이드</button>
        <button onclick="this.closest('.filter-tools-menu').classList.remove('open');showStatInfo()">📖 능력치 설명·계산식</button>
        <button id="form-toggle-btn" onclick="this.closest('.filter-tools-menu').classList.remove('open');_toggleFormDisplay()" title="최근 5경기 컨디션 뱃지 표시/숨김 (캡처용으로 끌 수 있음)">🔥 폼 표시 ON</button>
      </div>
    </div>
  </div>
  <div id="cards-active-filters" style="margin-bottom:14px"></div>
  <div id="cards-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px"></div>
</div>
